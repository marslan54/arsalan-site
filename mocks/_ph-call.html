<!DOCTYPE html><html lang="en"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Call</title>
<link rel="stylesheet" href="_ph.css">
<style>
body{background:linear-gradient(170deg,#102A22 0%,#0A1512 62%,#0A1512 100%)}
.top{text-align:center;padding:34px 20px 0}
.lbl{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:#8FB7A8;font-weight:650}
.num{font-size:28px;font-weight:620;letter-spacing:-.02em;margin-top:9px}
.place{font-size:13px;color:#9FB8B0;margin-top:5px}
.ava{margin:18px auto 0;display:inline-flex;align-items:center;gap:7px;background:rgba(198,221,102,.16);
  border:1px solid rgba(198,221,102,.34);color:#D7E89A;font-size:11.5px;font-weight:650;
  border-radius:999px;padding:6px 12px}
.ava b{width:6px;height:6px;border-radius:50%;background:#C6DD66;display:block}
.tr{margin-top:26px;padding:0 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.ln{font-size:13px;line-height:1.42;border-radius:13px;padding:9px 12px;max-width:88%}
.ln.a{background:rgba(255,255,255,.1);border-top-left-radius:5px}
.ln.c{background:rgba(198,221,102,.9);color:#16210A;margin-left:auto;border-top-right-radius:5px;font-weight:500}
.who{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:#7F9C92;margin-bottom:-4px}
.who.r{text-align:right}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 14px;padding:14px 30px 10px;text-align:center}
.keys span{font-size:10.5px;color:#9FB8B0}
.keys em{display:block;width:46px;height:46px;margin:0 auto 5px;border-radius:50%;background:rgba(255,255,255,.1)}
.end{width:62px;height:62px;border-radius:50%;background:#E24B3A;margin:4px auto 26px}
.timer{text-align:center;font-size:13px;color:#9FB8B0;margin-top:2px;font-variant-numeric:tabular-nums}
</style></head><body>
<div class="status"><span>9:41</span><span class="right">••••  <i></i></span></div>
<div class="top"><div class="lbl">Incoming · answered</div>
<div class="num">+1 (415) 555‑0142</div><div class="place">San Francisco, CA</div>
<div class="ava"><b></b>Ava is handling this call</div>
<div class="timer">00:34</div></div>
<div class="tr">
<div class="who">Ava</div><div class="ln a">Brightline Heating, this is Ava. How can I help?</div>
<div class="who r">Caller</div><div class="ln c">My boiler's out and it's freezing.</div>
<div class="who">Ava</div><div class="ln a">I can get an engineer to you today. Tuesday 8 AM or 10 AM — which suits?</div>
</div>
<div class="keys"><span><em></em>mute</span><span><em></em>keypad</span><span><em></em>speaker</span></div>
<div class="end"></div></body></html>
