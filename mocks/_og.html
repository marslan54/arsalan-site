<!DOCTYPE html><html lang="en"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8">
<meta name="viewport" content="width=1200,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  background:#FBFBF9;color:#15201A;display:flex;flex-direction:column;justify-content:space-between;
  padding:66px 72px}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{font-size:30px;font-weight:600;letter-spacing:-.02em}
.where{font-size:19px;color:#5C645E}
h1{font-size:92px;line-height:.98;letter-spacing:-.04em;font-weight:700;max-width:16ch}
h1 span{background:#C6DD66;padding:0 .1em;border-radius:5px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.bot{display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
p{font-size:24px;line-height:1.4;color:#49524C;max-width:30ch}
.tags{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end;max-width:460px}
.tags span{font-size:17px;border:1.5px solid #DDE2DC;border-radius:999px;padding:8px 17px;color:#49524C}
</style></head><body>
<div class="top"><span class="brand">arsalan</span><span class="where">Karachi · UTC+5 · worldwide</span></div>
<h1>Every call <span>answered.</span><br>Every lead <span>booked.</span></h1>
<div class="bot">
  <p>AI agents that answer the phone, reply to leads and run outbound — tested like software.</p>
  <div class="tags"><span>Vapi</span><span>Twilio</span><span>n8n</span><span>Claude</span><span>HubSpot</span><span>Cal.com</span></div>
</div>
</body></html>
